# ==============================================================================
# SwayFX Keybindings for Remote RTX 4070 LLM & RAG Infrastructure
# Append these lines to ~/.config/sway/config
# ==============================================================================

# Mod+m: Open LLM Remote Control Menu (Switch models, Wake-on-LAN, Mock server)
bindsym $mod+m exec $HOME/.local/bin/llm-ctl menu

# Mod+Shift+m: Instantly unload active LLM to free RTX 4070 GPU VRAM
bindsym $mod+Shift+m exec $HOME/.local/bin/llm-ctl unload
